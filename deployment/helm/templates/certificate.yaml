{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "wallet.name" . }}-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "wallet.tlsSecret" . }}
  dnsNames:
    - {{ include "wallet.hostname" . | quote }}
  issuerRef:
    name: {{ required "certificate.issuerRef.name is required" .Values.certificate.issuerRef.name | quote }}
    kind: {{ .Values.certificate.issuerRef.kind }}
    group: {{ .Values.certificate.issuerRef.group }}
{{- end }}
