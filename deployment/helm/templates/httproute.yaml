apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wallet.name" . }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "wallet.listenerSetName" . }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ .Values.listenerSet.listenerName }}
  hostnames:
    - {{ include "wallet.hostname" . | quote }}
  rules:
    {{- if .Values.api.backendName }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ .Values.api.backendName }}
          port: {{ .Values.api.backendPort }}
    {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "wallet.name" . }}-service
          port: {{ .Values.service.port }}
{{- if .Values.listenerSet.http.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "wallet.name" . }}-https-redirect
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "wallet.listenerSetName" . }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ .Values.listenerSet.http.listenerName }}
  hostnames:
    - {{ include "wallet.hostname" . | quote }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: {{ .Values.listenerSet.port }}
            statusCode: 301
{{- end }}
