{{- $reserved := list "KEYCLOAK_AUTH_URL" "KEYCLOAK_BASE_URL" "KEYCLOAK_REALM" "KEYCLOAK_CLIENT_ID" "NEXT_PUBLIC_API_URL" "NEXT_PUBLIC_ENV_URL" "NEXT_PUBLIC_API_URL_ACCOUNT_SERVICE" "WALLET_API_URL" "WALLET_ACCOUNT_SERVICE_URL" -}}
{{- range $key, $value := .Values.env -}}
{{- if has $key $reserved -}}{{ fail (printf "env.%s is generated; configure global.domain, global.tenantId or keycloak instead" $key) }}{{- end -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wallet.name" . }}-deployment-v2
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wallet.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wallet.labels" . | nindent 8 }}
    spec:
      {{- with .Values.frontendContainer.imagePullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: frontend-container
          image: "{{ .Values.frontendContainer.image }}:{{ .Values.frontendContainer.tag }}"
          imagePullPolicy: {{ .Values.frontendContainer.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.frontendContainer.port }}
          env:
            - name: KEYCLOAK_AUTH_URL
              value: {{ default (printf "https://%s.%s" .Values.keycloak.subdomain .Values.global.domain) .Values.keycloak.authUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ default .Values.global.tenantId .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: WALLET_API_URL
              value: {{ printf "https://%s/api" (include "wallet.hostname" .) | quote }}
            - name: WALLET_ACCOUNT_SERVICE_URL
              value: {{ printf "https://%s/api/accounts" (include "wallet.hostname" .) | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
