apiVersion: v1
kind: Service
metadata:
  name: {{ include "wallet.name" . }}-service
spec:
  selector:
    {{- include "wallet.labels" . | nindent 4 }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.frontendContainer.port }}
  type: {{ .Values.service.type }}
