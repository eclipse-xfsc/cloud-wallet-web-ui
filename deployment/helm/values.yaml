# Shared wrapper inputs: wallet.<global.tenantId>.<global.domain>.
# Keep these under global; there are no root domain/tenantId inputs.
global:
  domain: example.org
  tenantId: demo

replicaCount: 1
service:
  type: ClusterIP
  port: 3000
frontendContainer:
  image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/pcm-cloud/web-ui
  imagePullPolicy: Always
  tag: main
  port: 3000

keycloak:
  # Empty authUrl => https://<subdomain>.<domain>; empty realm => tenantId.
  authUrl: ""
  subdomain: auth
  clientId: wallet-web

# Reference only: the central Gateway is managed outside this chart.
gateway:
  name: envoy-gateway
  namespace: infrastructure

# Public exposure through an always-created tenant-owned ListenerSet.
listenerSet:
  listenerName: https
  port: 443
  annotations: {}
  allowedRoutes:
    namespaces:
      from: Same
  http:
    enabled: false
    listenerName: http
    port: 80

certificate:
  enabled: true
  # Empty => release-specific secret. Always in the release/ListenerSet namespace.
  secretName: ""
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io

# Optional existing API gateway service in the release namespace.
# Its /api path is forwarded unchanged. No API backend is deployed by this chart.
api:
  backendName: ""
  backendPort: 8080

# Additional environment variables; generated URL/auth keys are reserved.
env: {}
