# Mandatory per installation: wallet hostname = <tenantId>.<domain>.

domain: example.org
tenantId: demo

replicaCount: 1
service:
  type: ClusterIP
  port: 3000
frontendContainer:
  image: node-654e3bca7fbeeed18f81d7c7.ps-xaas.io/pcm-cloud/web-ui
  imagePullPolicy: Always
  tag: main
  port: 3000

keycloak:
  # Empty authUrl => https://<subdomain>.<domain>; empty realm => tenantId.
  authUrl: ""
  subdomain: auth
  clientId: wallet-web

# Created in the release namespace; GatewayClass must already exist.
gateway:
  create: true
  className: eg
  # Only when create=false: existing Gateway and its HTTPS listener.
  name: ""
  namespace: ""
  sectionName: https
  httpSectionName: http

certificate:
  enabled: true
  # Empty => release-specific secret. Created in the Gateway namespace.
  secretName: ""
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

# Optional existing API gateway service in the release namespace.
# Its /api path is forwarded unchanged. No API backend is deployed by this chart.
api:
  backendName: ""
  backendPort: 8080

# Additional environment variables; generated URL/auth keys are reserved.
env: {}
