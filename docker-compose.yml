services:
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.4.0}
    command: [start-dev, --import-realm]
    ports:
      - '127.0.0.1:8081:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deployment/local/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./deployment/docker/keycloak/themes/th1:/opt/keycloak/themes/gxfs:ro
  web-ui:
    image: node:20-bookworm-slim
    working_dir: /app
    command: [sh, -c, 'npm ci && npm run dev -- --hostname 0.0.0.0']
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      MOCK_MODE: 'false'
      NEXT_PUBLIC_LOCAL_LOGIN_DEBUG: 'true'
      LOCAL_ACCOUNT_MOCK: 'true'
      KEYCLOAK_AUTH_URL: http://localhost:8081
      KEYCLOAK_REALM: demo-tenant
      KEYCLOAK_CLIENT_ID: wallet
      WALLET_API_URL: /api
      WALLET_ACCOUNT_SERVICE_URL: /api/local-accounts
      NEXT_TELEMETRY_DISABLED: '1'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    depends_on:
      - keycloak
volumes:
  keycloak-data:
  node-modules:
  next-cache:
